<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>買方工作台｜房仲客戶統計</title><link rel="stylesheet" href="style.css"><body><header><small>REAL ESTATE · BUYER DESK</small><h1>買方工作台</h1><p>需求清楚，追蹤有序，每次帶看都有依據。</p><span>本機原型 · 虛構範例 · 無雲端同步</span></header><main><div id="stats" class="stats"></div><nav><button data-tab="buyers">買方需求</button><button data-tab="properties">房屋案件</button><button data-tab="visits">帶看紀錄</button><button data-tab="match">條件媒合</button></nav><section class="toolbar"><input id="search" placeholder="搜尋名稱、區域、備註"><select id="status"><option value="">所有狀態</option><option>新需求</option><option>追蹤中</option><option>待帶看</option><option>議價中</option><option>已成交</option><option>暫停</option></select><button id="add">＋新增</button><button id="export">匯出 CSV</button><label class="button">匯入 CSV<input type="file" id="import" accept=".csv" hidden></label></section><p id="hint"></p><div id="content"></div><footer><button id="backup">完整備份 JSON</button><label class="button">還原備份<input id="restore" type="file" accept=".json" hidden></label><p>資料只存在此瀏覽器。更換裝置不會同步，清除網站資料可能遺失，請定期備份。坪數統一使用「總建坪」，預算及開價單位為萬元。媒合僅依五項結構化條件，備註內容需人工確認。</p></footer></main><dialog id="dialog"><form id="form"><h2 id="title"></h2><div id="fields"></div><div class="actions"><button type="button" id="cancel">取消</button><button type="submit">儲存</button></div></form></dialog><script src="core.js"></script><script src="app.js"></script></body></html>
